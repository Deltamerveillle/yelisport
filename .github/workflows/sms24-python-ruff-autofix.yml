name: SMS24 Python Safe Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-safe-autofixes:
    if: github.ref_name == 'feature/sms24-portail-live-news-publicite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sms24-portail-live-news-publicite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository-pinned Ruff
        run: python -m pip install ruff==0.8.4
      - name: Apply only Ruff safe fixes
        working-directory: services/api
        shell: bash
        run: |
          ruff check . --fix --output-format concise || true
          ruff format app/sms24/ingestion.py app/sms24/providers/espn.py app/sms24/providers/sportmonks.py app/sms24/standings_runner.py tests/test_sms24_espn_provider.py tests/test_sms24_sportmonks_provider.py tests/test_sms24_worker.py
          ruff check . --fix --output-format concise || true
          ruff check . --statistics || true
      - name: Commit safe mechanical changes on this PR branch
        shell: bash
        run: |
          git add services/api
          git diff --cached --name-only -- 'services/api/*.py' 'services/api/**/*.py' | while IFS= read -r path; do
            [ -f "$path" ] || continue
            sed -i 's/[[:blank:]]*$//' "$path"
          done
          git add services/api
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No safe automatic fixes remain"
          else
            git -c user.name='sms24-ci-bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(api): apply Ruff safe autofixes throughout backend'
            git push origin HEAD:feature/sms24-portail-live-news-publicite
          fi
