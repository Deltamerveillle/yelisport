name: SMS24 Cloudflare CORS Contract

on:
  pull_request:
    paths:
      - "services/api/app/main.py"
      - "services/api/tests/api/test_sms24_cloudflare_cors.py"
      - ".github/workflows/sms24-cloudflare-cors-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint modified files
        run: ruff check app/main.py tests/api/test_sms24_cloudflare_cors.py
      - name: Test Cloudflare origin allowlist
        run: pytest -q tests/api/test_sms24_cloudflare_cors.py
        env:
          APP_ENV: test
