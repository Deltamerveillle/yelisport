name: SMS24 Sports Public Access Contract

on:
  pull_request:
    paths:
      - "services/api/app/api/v1/endpoints/sports.py"
      - "services/api/tests/api/test_sports.py"
      - ".github/workflows/sms24-sports-public-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sports-public-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Lint changed sports files only
        run: ruff check app/api/v1/endpoints/sports.py tests/api/test_sports.py
      - name: Verify public sports HTTP contracts
        run: pytest -q tests/api/test_sports.py
        env:
          APP_ENV: test
